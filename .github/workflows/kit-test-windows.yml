name: Kit test (Windows)

# By hand: install-windows.ps1 of a release on a CI Windows machine, as a student runs it in PowerShell.
# With "block_codeberg" codeberg.org does not resolve (as on a school network): the installer must use the mirrors.
# Then checks that every file of reaper-packages.txt for win64 is in REAPER's resource folder.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Suite version (tag suite-<version>); empty = latest"
        default: ""
      block_codeberg:
        description: "Make codeberg.org unreachable"
        type: boolean
        default: true

jobs:
  kit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Block codeberg.org
        if: inputs.block_codeberg
        shell: pwsh
        run: |
          Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value "`n0.0.0.0 codeberg.org"
          try { Resolve-DnsName codeberg.org -ErrorAction Stop | Out-String | Write-Host } catch { Write-Host "codeberg.org blocked" }

      - name: Install as a student (Windows PowerShell)
        shell: powershell
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:VERSION) {
            $s = irm "https://github.com/animALavoro/Objet/releases/download/suite-$env:VERSION/install-windows.ps1"
            & ([scriptblock]::Create($s)) all $env:VERSION
          } else {
            irm https://github.com/animALavoro/Objet/releases/latest/download/install-windows.ps1 | iex
          }

      - name: Check the files
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $base = if ($env:VERSION) { "https://github.com/animALavoro/Objet/releases/download/suite-$env:VERSION" } else { "https://github.com/animALavoro/Objet/releases/latest/download" }
          $res = Join-Path $env:APPDATA "REAPER"
          $missing = 0
          foreach ($line in (Invoke-WebRequest -UseBasicParsing "$base/reaper-packages.txt").Content -split "`n") {
            $f = $line -split "`t"
            if ($f.Count -lt 3 -or ($f[0] -ne "*" -and $f[0] -ne "win64")) { continue }
            $p = Join-Path $res $f[1]
            if (-not (Test-Path $p)) { Write-Host "MISSING $($f[1])"; $missing++ }
          }
          foreach ($p in @("UserPlugins\reaper_reapack-x64.dll", "Scripts\Polywav Manager\Polywav Manager.lua")) {
            if (-not (Test-Path (Join-Path $res $p))) { Write-Host "MISSING $p"; $missing++ }
          }
          foreach ($p in @("LB Spanner.vst3", "Objet a Scene.vst3", "Objet a Monitor.vst3")) {
            if (-not (Test-Path (Join-Path "$env:CommonProgramFiles\VST3" $p))) { Write-Host "MISSING VST3 $p"; $missing++ }
          }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\OTIO to RPP\OTIO to RPP.exe")) { Write-Host "MISSING OTIO to RPP"; $missing++ }
          Get-ChildItem -Recurse $res | Select-Object -ExpandProperty FullName | Write-Host
          if ($missing -gt 0) { throw "$missing files missing" }
          Write-Host "all files in place"
