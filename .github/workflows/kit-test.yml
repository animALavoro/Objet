name: Kit test (Mac)

# By hand: the student kit on a CI Mac, as a student gets it. REAPER (evaluation) from Homebrew, install-mac.sh of a
# release, the course configuration (unzipped in REAPER's resource folder, as Import configuration does), then REAPER
# runs tests/mac/kit_test.lua: extensions loaded, actions registered, each script run, a screenshot each phase
# (branch kit-shots). kit = post: the post-production course's kit (release "post", or post-<version>).

on:
  workflow_dispatch:
    inputs:
      kit:
        description: "suite = the immersive course (latest release); post = the post-production course (release post)"
        type: choice
        options: [suite, post]
        default: suite
      version:
        description: "Version (tag suite-<version> or post-<version>); empty = the one students get"
        default: ""

permissions:
  contents: write

jobs:
  kit:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: REAPER
        run: |
          brew install --cask reaper
          brew install --cask blackhole-2ch || echo "blackhole not installed"
          sudo killall coreaudiod || true

      - name: Install the kit as a student
        env:
          KIT: ${{ inputs.kit }}
          VERSION: ${{ inputs.version }}
        run: |
          R=https://github.com/animALavoro/Objet/releases
          if [ "$KIT" = post ]; then part=post; cfg=Post_Produzione.ReaperConfigZip; fixed="$R/download/post"
          else part=all; cfg=Cinema_Immersivo.ReaperConfigZip; fixed="$R/latest/download"; fi
          if [ -n "$VERSION" ]; then
            base="$R/download/$( [ "$KIT" = post ] && echo post || echo suite )-$VERSION"
            curl -fsSL "$base/install-mac.sh" | bash -s -- "$part" "$VERSION"
          else
            base="$fixed"
            curl -fsSL "$base/install-mac.sh" | bash      # the students' line, without arguments
          fi
          curl -fsSL -o "$TMPDIR/cfg.zip" "$base/$cfg"
          if [ "$KIT" = post ]; then
            # the post kit has none of the immersive course's plugins
            for b in "LB Spanner.vst3" "Objet a Scene.vst3" "Objet a Monitor.vst3"; do
              [ ! -e "$HOME/Library/Audio/Plug-Ins/VST3/$b" ] || { echo "::error::$b installed by the post kit"; exit 1; }
            done
            ls "$HOME/Library/Audio/Plug-Ins/VST3" || true
          fi
          RES="$HOME/Library/Application Support/REAPER"
          mkdir -p "$RES" && cd "$RES" && unzip -o -q "$TMPDIR/cfg.zip" && rm -f reaper-configzip-info
          find "$RES" -maxdepth 3 | sort

      - name: Run REAPER, screenshot each phase
        run: |
          mkdir -p shots
          printf '<REAPER_PROJECT 0.1 "7.0" 0\n>\n' > "$TMPDIR/kit.rpp"
          /Applications/REAPER.app/Contents/MacOS/REAPER -newinst "$TMPDIR/kit.rpp" "$GITHUB_WORKSPACE/tests/mac/kit_test.lua" > reaper.out 2>&1 &
          RP=$!
          # only the first-run audio question and the evaluation reminder are closed: any other window is what a student sees
          ( for i in $(seq 1 150); do
              osascript -e 'tell application "System Events" to tell process "REAPER"
                repeat with w in (every window whose name starts with "About REAPER" or name is "REAPER New Version Notification")
                  try
                    click (first button of w whose subrole is "AXCloseButton")
                  end try
                end repeat
                repeat with w in every window
                  try
                    if (value of every static text of w as text) contains "audio device" then click button "No" of w
                  end try
                end repeat
              end tell' >> dialogs.txt 2>&1 || true
              sleep 1
            done ) &
          for n in 1 2 3 4 5; do
            t=0
            until [ -f "$TMPDIR/kit_phase_$n" ] || [ $t -ge 180 ]; do sleep 1; t=$((t+1)); done
            if [ ! -f "$TMPDIR/kit_phase_$n" ]; then
              echo "phase $n never came"; screencapture -x "shots/$n-timeout.png"
              osascript -e 'tell application "System Events" to get name of every window of process "REAPER"' > "shots/$n-windows.txt" 2>&1 || true
              osascript -e 'tell application "System Events" to tell process "REAPER" to get entire contents of front window' > "shots/$n-front.txt" 2>&1 || true
              break
            fi
            name=$(cat "$TMPDIR/kit_phase_$n")
            sleep 4
            screencapture -x "shots/$n-$name.png" || echo "screencapture failed"
            # an error or a "please install" message is a step a student would have to do by hand: record it, close it
            osascript -e 'tell application "System Events" to tell process "REAPER"
                set found to ""
                repeat with w in every window
                  try
                    set t to (value of every static text of w as text)
                    if t contains "License Key" then set found to found & "nvk licence window" & linefeed
                    if t contains "install" or t contains "Error" or t contains "required" or t contains "missing" then
                      set found to found & t & linefeed
                      try
                        click button "OK" of w
                      end try
                    end if
                  end try
                end repeat
                return found
              end tell' > "shots/$n-problems.txt" 2>&1 || true
            [ -s "shots/$n-problems.txt" ] && { echo "PROBLEM in phase $n:"; cat "shots/$n-problems.txt"; }
            # nvk_SEARCH's licence window (a key per person, from nvk): recorded above, cancelled to go on
            osascript -e 'tell application "System Events" to tell process "REAPER"
                repeat with w in (every window whose name is "nvk_SEARCH")
                  try
                    if exists (text field "License Key" of w) then click button "Cancel" of w
                  end try
                end repeat
              end tell' >> "shots/$n-problems.txt" 2>&1 || true
            osascript -e 'tell application "System Events" to get name of every window of process "REAPER"' > "shots/$n-windows.txt" 2>&1 || true
            osascript -e 'tell application "System Events" to tell process "REAPER" to get value of every static text of every window' > "shots/$n-texts.txt" 2>&1 || true
            touch "$TMPDIR/kit_ack_$n"
          done
          t=0; while kill -0 $RP 2>/dev/null && [ $t -lt 30 ]; do sleep 1; t=$((t+1)); done
          kill $RP 2>/dev/null || true
          cp "$TMPDIR/kit_test.txt" reaper.out dialogs.txt shots/ 2>/dev/null || true
          ls -R "$HOME/Library/Application Support/REAPER/UserPlugins" "$HOME/Library/Application Support/REAPER/ReaPack" > shots/files.txt 2>&1 || true
          cat shots/kit_test.txt || true

      - name: Screenshots to the kit-shots branch
        if: always()
        run: |
          rm -rf /tmp/kit-shots && mkdir /tmp/kit-shots && cp -R shots/. /tmp/kit-shots/ && cd /tmp/kit-shots
          git init -q -b kit-shots
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          echo "run ${{ github.run_id }}, kit '${{ inputs.kit }}', version '${{ inputs.version }}'" > RUN.txt
          git add -A && git commit -q -m "kit screenshots, run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" kit-shots
