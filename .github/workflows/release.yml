name: Release

# By hand (Actions > Release > Run workflow). It builds from the private source repositories (token SOURCE_TOKEN,
# contents read-only), for Windows and macOS (universal arm64 + x86_64, ad-hoc signature), and publishes:
#  - what = all: one release of the suite, tag suite-<version>; marked latest (what the install line uses) only with
#    "latest" ticked: otherwise it is tried first with "| bash -s -- all <version>", then Edit release > Set as latest;
#  - what = post: the post-production course kit, tag post-<version>: OTIO to RPP, Polywav Manager, Objet a Loudness
#    (only with loudness_ref set), the installers set to the post kit (tools/prepare_kit.sh) and kit/post/*. Always a
#    pre-release, so that the suite stays the latest; with "latest" ticked its files also go to the release "post"
#    (tools/promote_post.sh), where the course's install line takes them;
#  - what = pa / scene / monitor / loudness / otio / polywav: a release of that one only, tag <what>-<version>, not latest.
# The suite: the three VST3 plugins, the OTIO -> RPP app (Windows .exe, macOS .app for Apple silicon) and the
# Polywav Manager script for REAPER (Lua, same zip for both systems).
# This repository is public: GitHub Actions minutes are free here, macOS included.
# With publish off it is also the plugins' CI (the private repositories have no Actions minutes): what = one plugin
# (pa / scene / monitor / loudness) and its branch builds and tests only that plugin, on Windows and macOS, with the
# zips in the run's artifacts; what = all with loudness_ref set builds and tests every plugin.

on:
  workflow_dispatch:
    inputs:
      what:
        description: "all = the suite; post = the post-production kit; or one part only"
        type: choice
        options: [all, post, pa, scene, monitor, loudness, otio, polywav]
        default: all
      version:
        description: "Version, e.g. 2026.11.10 (suite, post) or v0.2.0 (one plugin); any text when not publishing"
        required: true
      pa_ref:
        description: "LB-Spanner: branch, tag or commit"
        default: main
      scene_ref:
        description: "Objet-a-Scene: branch, tag or commit"
        default: main
      monitor_ref:
        description: "Objet-a-Monitor: branch, tag or commit"
        default: main
      loudness_ref:
        description: "Objet-a-Loudness: branch, tag or commit; empty = all and post without it (what = loudness: main)"
        default: ""
      otio_ref:
        description: "OTIO-to-RPP: branch, tag or commit"
        default: main
      polywav_ref:
        description: "polywav_manager: branch, tag or commit"
        default: main
      publish:
        description: "Publish a release. Off: build and test only (zips in the run's artifacts), e.g. to check a branch on macOS"
        type: boolean
        default: true
      latest:
        description: "Mark as latest (students get it; post: copied to the release 'post'). Off: a pre-release, reachable only with the version, to try it first"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      tag: ${{ steps.m.outputs.tag }}
    steps:
      - id: m
        env:
          WHAT: ${{ inputs.what }}
          VERSION: ${{ inputs.version }}
          LOUDNESS_REF: ${{ inputs.loudness_ref }}
        run: |
          all='[
            {"id":"pa","repo":"animALavoro/LB-Spanner","name":"Objet-Pa","target":"LBSpanner_VST3","tests":"lbs_tests","opts":"-DLBS_BUILD_TESTS=ON","bundle":"build/LBSpanner_artefacts/Release/VST3/LB Spanner.vst3","extra":"README.md README.it.md CHANGELOG.md"},
            {"id":"scene","repo":"animALavoro/Objet-a-Scene","name":"Objet-a-Scene","target":"ObjetAScene_VST3","tests":"oas_tests","opts":"-DOAS_BUILD_TESTS=ON","bundle":"build/ObjetAScene_artefacts/Release/VST3/Objet a Scene.vst3","extra":"README.md README.it.md"},
            {"id":"monitor","repo":"animALavoro/Objet-a-Monitor","name":"Objet-a-Monitor","target":"ObjetMonitor_VST3","tests":"lbm_tests","opts":"-DLBM_BUILD_TESTS=ON","bundle":"build/ObjetMonitor_artefacts/Release/VST3/Objet a Monitor.vst3","extra":"README.md README.it.md THIRD_PARTY_LICENSES"},
            {"id":"loudness","repo":"animALavoro/Objet-a-Loudness","name":"Objet-a-Loudness","target":"ObjetALoudness_VST3","tests":"ola_tests","opts":"-DOLA_BUILD_TESTS=ON","bundle":"build/ObjetALoudness_artefacts/Release/VST3/Objet a Loudness.vst3","extra":"README.md README.it.md"}
          ]'
          case "$WHAT" in
            # Objet a Loudness only with loudness_ref set (e.g. a check build of every plugin: all, publish off)
            all)  if [ -n "$LOUDNESS_REF" ]; then sel="$all"; else sel=$(echo "$all" | jq -c '[.[] | select(.id != "loudness")]'); fi ;;
            post) if [ -n "$LOUDNESS_REF" ]; then sel=$(echo "$all" | jq -c '[.[] | select(.id == "loudness")]'); else sel='[]'; fi ;;
            *)    sel=$(echo "$all" | jq -c --arg w "$WHAT" '[.[] | select(.id == $w)]') ;;
          esac
          echo "matrix=$(echo "$sel" | jq -c .)" >> "$GITHUB_OUTPUT"
          if [ "$WHAT" = all ]; then echo "tag=suite-$VERSION" >> "$GITHUB_OUTPUT"; else echo "tag=$WHAT-$VERSION" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: true
      matrix:
        plugin: ${{ fromJSON(needs.plan.outputs.matrix) }}
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.plugin.repo }}
          ref: ${{ matrix.plugin.id == 'pa' && inputs.pa_ref || matrix.plugin.id == 'scene' && inputs.scene_ref || matrix.plugin.id == 'loudness' && (inputs.loudness_ref || 'main') || inputs.monitor_ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ matrix.plugin.id }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -A x64 ${{ matrix.plugin.opts }}

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 ${{ matrix.plugin.opts }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4 --target ${{ matrix.plugin.target }} ${{ matrix.plugin.tests }}

      # a CPU threshold on a shared runner is only a warning (times vary from run to run); any other FAIL stops the build
      - name: Engine tests
        shell: bash
        run: |
          t=$(find build -type f \( -name '${{ matrix.plugin.tests }}' -o -name '${{ matrix.plugin.tests }}.exe' \) | head -1)
          set +e; "$t" > tests.log 2>&1; code=$?; set -e
          cat tests.log
          if [ $code -ne 0 ]; then
            if ! grep -q "^FAIL" tests.log; then echo "::error::tests exited with $code"; exit $code; fi
            if grep "^FAIL" tests.log | grep -v "CPU" | grep -q .; then grep "^FAIL" tests.log | grep -v "CPU" | while IFS= read -r l; do echo "::error::$l"; done; exit 1; fi
            grep "^FAIL" tests.log | while IFS= read -r l; do echo "::warning::CPU on a shared runner: $l"; done
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "${{ matrix.plugin.bundle }}" dist\
          foreach ($f in "${{ matrix.plugin.extra }}".Split(' ')) { if (Test-Path $f) { Copy-Item $f dist\ } }
          if (Test-Path LICENSE) { Copy-Item LICENSE dist\ }
          Compress-Archive -Path dist\* -DestinationPath "${{ matrix.plugin.name }}-Windows.zip"

      # ad-hoc signature (no Apple developer account): the zip holds only the bundle, the install line unpacks it as it is
      - name: Sign and package (macOS)
        if: runner.os == 'macOS'
        run: |
          b="${{ matrix.plugin.bundle }}"
          lipo -info "$b/Contents/MacOS/"*
          codesign --force --deep --sign - "$b"
          codesign --verify --deep --strict --verbose=2 "$b"
          ditto -c -k --keepParent "$b" "${{ matrix.plugin.name }}-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin.name }}-${{ runner.os }}
          path: ${{ matrix.plugin.name }}-*.zip

  # the OTIO -> RPP app (Python + Tkinter, frozen with PyInstaller): Windows one-file .exe, macOS .app (arm64, ad-hoc signed)
  otio:
    needs: plan
    if: inputs.what == 'all' || inputs.what == 'post' || inputs.what == 'otio'
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: animALavoro/OTIO-to-RPP
          ref: ${{ inputs.otio_ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller and a test conversion
        shell: bash
        run: |
          python -m pip install pyinstaller==6.22.3
          python converter.py esempio.otio esempio.rpp
          test -s esempio.rpp
          test -f resolve_export_reaper.py        # the app installs it in Resolve's Scripts menu (packed with --add-data)

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "OTIO to RPP" --add-data "resolve_export_reaper.py:." app.py
          Compress-Archive -Path "dist/OTIO to RPP.exe" -DestinationPath OTIO-to-RPP-Windows.zip

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --windowed --name "OTIO to RPP" --osx-bundle-identifier com.lucabagetto.otio-to-rpp --add-data "resolve_export_reaper.py:." app.py
          codesign --force --deep --sign - "dist/OTIO to RPP.app"
          codesign --verify --deep --strict "dist/OTIO to RPP.app"
          ditto -c -k --keepParent "dist/OTIO to RPP.app" OTIO-to-RPP-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OTIO-to-RPP-${{ runner.os }}
          path: OTIO-to-RPP-*.zip

  # the Polywav Manager script (Lua): its tests, then one zip with the folder "Polywav Manager" for REAPER's Scripts
  polywav:
    needs: plan
    if: inputs.what == 'all' || inputs.what == 'post' || inputs.what == 'polywav'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: animALavoro/polywav_manager
          ref: ${{ inputs.polywav_ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
          path: src

      - name: Tests and zip
        run: |
          sudo apt-get install -y -qq lua5.4 > /dev/null
          (cd src && lua5.4 tests/run_tests.lua && lua5.4 tests/project_tests.lua)
          mkdir -p "pkg/Polywav Manager"
          cp -R "src/Polywav Manager.lua" src/polywav_manager src/README.md src/README.it.md "pkg/Polywav Manager/"
          (cd pkg && zip -qr ../Polywav-Manager.zip "Polywav Manager")
          unzip -l Polywav-Manager.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Polywav-Manager
          path: Polywav-Manager.zip

  release:
    needs: [plan, build, otio, polywav]
    if: >-
      always() && inputs.publish && needs.plan.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.otio.result == 'success' || needs.otio.result == 'skipped')
      && (needs.polywav.result == 'success' || needs.polywav.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          WHAT: ${{ inputs.what }}
          VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.latest }}
        run: |
          # the installers and the course's REAPER configuration (post: the installers set to the post kit)
          if [ "$WHAT" = post ]; then kit=post; else kit=suite; fi
          tools/prepare_kit.sh "$kit" dist
          python3 tools/reaper_packages.py dist/reaper-packages.txt   # SWS, js_ReaScriptAPI, ReaImGui, pie menu, nvk_SEARCH: where to get them
          ls -l dist
          if [ "$WHAT" = post ]; then
            # always a pre-release: the suite stays GitHub's latest (the immersive course's install line)
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Post produzione $VERSION" --notes-file NOTES-post.md --prerelease --latest=false
            if [ "$LATEST" = true ]; then tools/promote_post.sh "$TAG" dist; fi
            exit 0
          fi
          flags=()
          # GitHub's latest is the newest release that is not a pre-release (make_latest=false is not enough):
          # a release to try first is published as a pre-release, then Edit release > untick pre-release + Set as latest
          if [ "$WHAT" = all ] && [ "$LATEST" = true ]; then flags+=(--latest); else flags+=(--prerelease --latest=false); fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file NOTES.md "${flags[@]}"
